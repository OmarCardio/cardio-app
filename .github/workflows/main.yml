name: Build Applications

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
      - run: cp pubspec.yaml pubspec.yaml.bak
      - run: flutter create . --platforms=android --org com.cardio.app
      - run: cp pubspec.yaml.bak pubspec.yaml
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: CardioApp-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
      - run: copy pubspec.yaml pubspec.yaml.bak
      - run: flutter config --enable-windows-desktop
      - run: flutter create . --platforms=windows --org com.cardio.app
      - run: copy /y pubspec.yaml.bak pubspec.yaml
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: CardioApp-Windows-EXE
          path: build/windows/x64/runner/Release/
