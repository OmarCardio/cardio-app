name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          
      - name: Replacer le projet Flutter
        run: |
          mkdir temp_lib
          cp -r lib/* temp_lib/
          cp pubspec.yaml temp_pubspec.yaml
          flutter create . --platforms=android --org com.cardio.app
          cp -r temp_lib/* lib/
          cp temp_pubspec.yaml pubspec.yaml
          
      - name: Obtenir les dépendances
        run: flutter pub get
        
      - name: Compiler APK
        run: flutter build apk --release --no-tree-shake-icons
        
      - name: Telecharger APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioApp-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
