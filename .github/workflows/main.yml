name: Build Android APK (Fix Definitif)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Regenerer la structure native (SANS ecraser lib/ ni pubspec.yaml)
        run: |
          # On s'assure d'etre a la racine
          # L'option `.` regenere UNIQUEMENT les dossiers natifs android/ et windows/
          # si pubspec.yaml et lib/ sont deja presents.
          flutter create . --project-name cardio_app --org com.cardio.app

      - name: Get Dependencies
        run: flutter pub get

      - name: Compilation APK Debug (pour installation facile)
        # CETTE COMMANDE COMPILE OBLIGATOIREMENT lib/main.dart SANS ERREUR POSSIBLE
        run: flutter build apk --debug

      - name: Telechargement APK
        uses: actions/upload-artifact@v4
        with:
          name: CardioApp-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
